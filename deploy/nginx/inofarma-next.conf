# Nginx site for the Next.js app: replaces /etc/nginx/sites-available/inofarma
# (Laravel's, DEPLOYMENT.md in ~/inofarma §1.8) at cutover.
#
# HTTPS is written out here instead of left to `certbot --nginx`, so the cutover is one
# nginx reload: `deploy/cutover.sh prepare` fills in the names and the certificate Laravel's
# site uses today. For the trial hostname (DEPLOYMENT.md §1.6) they are filled in by hand.

upstream inofarma_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Plain HTTP only redirects. The redirect sits in `location /`, not at server level, so
# certbot's renewal can still answer its /.well-known/acme-challenge/ requests here.
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    # as certbot writes them
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;

    # Laravel's limit; Next's proxy is set to the same (proxyClientMaxBodySize in next.config.ts)
    client_max_body_size 20M;

    # X-Frame-Options and X-Content-Type-Options come from the app itself (next.config.ts
    # headers()); adding them here too would send each header twice.

    # Uploads (UPLOADS_DISK=public) are served from disk, as Laravel's public/storage
    # symlink was. `next start` only serves files that existed when it was built, so a
    # photo uploaded after a deploy would be a 404 without this. Same folder as Laravel's,
    # so both apps see the same files while Laravel is kept as a fallback.
    location /storage/ {
        alias /var/www/inofarma/storage/app/public/;
        try_files $uri =404;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; proxy_pass http://inofarma_next; }
    location = /robots.txt  { access_log off; log_not_found off; proxy_pass http://inofarma_next; }

    location / {
        proxy_pass http://inofarma_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app checks the browser's Origin against this host (CSRF): pass it exactly as
        # the browser sent it, port included ($host would drop a non-standard port).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The client's address, overwritten, never appended to: rate limits (sign-in, OTP,
        # password reset, chat) key on the first X-Forwarded-For entry, so a value sent by
        # the client must not survive. Laravel got REMOTE_ADDR from PHP-FPM the same way.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # pages stream (React Suspense); nginx would otherwise hold them until complete
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
