# Supervisor program for the Next.js web server: copy to
# /etc/supervisor/conf.d/inofarma-next-web.conf (DEPLOYMENT.md §1.5). It runs from
# /var/www/inofarma-next/current, the release deploy/deploy.sh switches to.

# The web server, on localhost only: nginx is the way in.
[program:inofarma-next-web]
command=/var/www/inofarma-next/current/node_modules/.bin/next start -H 127.0.0.1 -p 3000
directory=/var/www/inofarma-next/current
user=cuncis
; uploaded files stay group-writable for www-data, as Laravel's were (chmod 775)
umask=002
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/inofarma-next/shared/logs/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
