# Install scripts that stay off: each one only checks for, or builds, a prebuilt binary pnpm already installed
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
peerDependencyRules:
  allowedVersions:
    eslint: "10"
allowedDeprecatedVersions:
  # Transitive via @google-cloud/storage -> node-fetch@3; on Node >=17 it just re-exports the built-in DOMException
  node-domexception: "1.0.0"
