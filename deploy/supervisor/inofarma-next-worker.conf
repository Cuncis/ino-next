# Supervisor program for the Next.js worker. Not installed by hand: deploy/cutover.sh
# copies it to /etc/supervisor/conf.d/ at the switch and removes it at a rollback, so it
# never runs beside Laravel's queue:work and schedule:run, not even after a reboot.

# Laravel's `queue:work` and `schedule:run` in one process: the queue (notifications,
# chat reply emails, newsletters) and the four scheduled tasks, in Jakarta time.
# Exactly one process may run the scheduler; more workers need WORKER_SCHEDULE=false.
[program:inofarma-next-worker]
command=/var/www/inofarma-next/current/node_modules/.bin/tsx --env-file=.env.local src/jobs/worker.ts
directory=/var/www/inofarma-next/current
environment=NODE_ENV="production"
user=cuncis
umask=002
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; a newsletter to every subscriber may take a while: let the running job finish (Laravel allowed an hour)
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/inofarma-next/shared/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
