# Supervisor programs for the Next.js app: copy to /etc/supervisor/conf.d/inofarma-next.conf
# (DEPLOYMENT.md §1.6). Both run from /var/www/inofarma-next/current, the release
# deploy/deploy.sh switches to; a restart picks up the new one.

# The web server, on localhost only: nginx is the way in.
[program:inofarma-next-web]
command=/var/www/inofarma-next/current/node_modules/.bin/next start -H 127.0.0.1 -p 3000
directory=/var/www/inofarma-next/current
user=cuncis
; uploaded files stay group-writable for www-data, as Laravel's were (chmod 775)
umask=002
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/inofarma-next/shared/logs/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

# Laravel's `queue:work` and `schedule:run` in one process: the queue (notifications,
# chat reply emails, newsletters) and the four scheduled tasks, in Jakarta time.
# Exactly one process may run the scheduler; more workers need WORKER_SCHEDULE=false.
[program:inofarma-next-worker]
command=/var/www/inofarma-next/current/node_modules/.bin/tsx --env-file=.env.local src/jobs/worker.ts
directory=/var/www/inofarma-next/current
environment=NODE_ENV="production"
user=cuncis
umask=002
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; a newsletter to every subscriber may take a while: let the running job finish (Laravel allowed an hour)
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/inofarma-next/shared/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
